<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Classifier AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text-main); }
        .app-container { width: 100%; max-width: 640px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); border: 1px solid var(--border-color); overflow: hidden; }
        nav { display: flex; background: #f8fafc; border-bottom: 1px solid var(--border-color); padding: 8px 16px; gap: 8px; }
        nav a { padding: 10px 18px; text-decoration: none; color: var(--text-muted); font-size: 14px; font-weight: 500; border-radius: 8px; transition: all 0.2s ease; }
        nav a:hover { color: var(--primary); background: #e0e7ff; }
        .content { padding: 36px 32px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: inline-block; background: var(--primary); color: #ffffff; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); text-align: center; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35); }
        .alert { padding: 14px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 10px; font-size: 14px; font-weight: 500; margin-bottom: 20px; }
        .alert-danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        
        /* Drop Zone Styles */
        .drop-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 36px 20px; text-align: center; background: #fafafa; transition: all 0.2s ease; cursor: pointer; margin-bottom: 24px; width: 100%; box-sizing: border-box; }
        .drop-zone:hover { border-color: var(--primary); background: #f5f3ff; }
        .icon-wrapper { display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; border-radius: 50%; background: #e0e7ff; color: var(--primary); margin-bottom: 12px; }
        input[type="file"] { display: none; }
        .file-label { font-size: 14px; font-weight: 500; color: var(--text-main); }
        .badge-list { list-style: none; display: flex; gap: 12px; margin-bottom: 24px; }
        .badge { background: #f1f5f9; border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/upload">Upload CSV</a>
            <a href="/classify">Results</a>
        </nav>
        <div class="content">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
