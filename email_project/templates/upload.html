{% extends "base.html" %}
{% block content %}
<h2>Upload Email List</h2>
<p>Select a <code>.csv</code> file containing email addresses in the first column to start batch classification.</p>

<form action="/upload" method="POST" enctype="multipart/form-data">
    <label for="csv_file" class="drop-zone" id="zone">
        <div class="icon-wrapper">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
        </div>
        <div class="file-label" id="file-name">Click to browse or drag & drop CSV file</div>
    </label>
    <input type="file" id="csv_file" name="csv_file" accept=".csv" required onchange="updateFileName(this)">
    <button type="submit" class="btn" style="width: 100%;">Upload & Process Database</button>
</form>

<script>
function updateFileName(input) {
    if (input.files && input.files[0]) {
        document.getElementById('file-name').innerText = "Selected: " + input.files[0].name;
    }
}
</script>
{% endblock %}
